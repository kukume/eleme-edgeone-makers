name: Release latest upload zip

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pack-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - run: npm run pack

      - name: Recreate rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view latest >/dev/null 2>&1 \
            && gh release delete latest --yes --cleanup-tag \
            || true
          gh release create latest \
            eleme-edgeone-upload.zip \
            --title "latest" \
            --notes "Rolling upload package from ${GITHUB_SHA}" \
            --latest
